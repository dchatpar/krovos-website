<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="circuit-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#circuit-gradient)" stroke-width="1" opacity="0.5">
    <!-- Horizontal lines -->
    <line x1="20" y1="40" x2="180" y2="40"/>
    <line x1="20" y1="80" x2="180" y2="80"/>
    <line x1="20" y1="120" x2="180" y2="120"/>
    <line x1="20" y1="160" x2="180" y2="160"/>
    <!-- Vertical lines -->
    <line x1="40" y1="20" x2="40" y2="180"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="120" y1="20" x2="120" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <!-- Circuit nodes -->
    <circle cx="40" cy="40" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="80" cy="40" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="120" cy="40" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="160" cy="40" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="40" cy="80" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="80" cy="80" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="120" cy="80" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="160" cy="80" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="40" cy="120" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="80" cy="120" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="120" cy="120" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="160" cy="120" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="40" cy="160" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="80" cy="160" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="120" cy="160" r="3" fill="currentColor" opacity="0.5"/>
    <circle cx="160" cy="160" r="3" fill="currentColor" opacity="0.5"/>
  </g>
</svg>